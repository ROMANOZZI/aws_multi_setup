AWSTemplateFormatVersion: '2010-09-09'
Description: >
  This template is intended to create an S3 bucket for the terraform project state.

Parameters: 
  BucketName:
    Type: String
    AllowedPattern: '^[a-z0-9.-]+$'
    Description: unique Bucket name.
    Default: terraform-state-uniiqe-locckk-naame

Resources: 
  terraformS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags: 
        - Key: "Name"
          Value: !Ref BucketName


  terraformS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref terraformS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceHTTPSOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt terraformS3Bucket.Arn
              - !Sub "${terraformS3Bucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

Outputs:
  BucketName:
    Description: The name of the S3 bucket created for Terraform state.
    Value: !Ref terraformS3Bucket